# Test builds: a push to a test/* branch builds RouteX.exe on Windows and keeps it as a workflow artifact.
# Nothing is released or published: the exe also goes to the builds/test branch (overwritten each time)
# so it can be fetched with plain git.
name: Test build

on:
  push:
    branches: ['test/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: call src\build.cmd

      - name: Check interface script
        shell: bash
        run: node -e "const s=require('fs').readFileSync('src/WebUi/interface.html','utf8');for(const m of s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g))new Function(m[1].replace('ROUTEX_HOST_INITIAL_JSON','{}'));console.log('interface script parses')"

      - name: AmneziaWG self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\RouteX.exe -ArgumentList '--awgtest', "$PWD\awgtest.txt" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'awgtest timed out' }
          Get-Content awgtest.txt
          if (-not (Select-String -Path awgtest.txt -Pattern 'AWG-SELFTEST: OK' -Quiet)) { throw 'AmneziaWG self-test failed' }
          # the generated config must be accepted by the real Windows mihomo
          Invoke-WebRequest -Uri https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-windows-amd64-v1-v1.19.34.zip -OutFile mihomo.zip
          Expand-Archive mihomo.zip -DestinationPath mihomo-ci
          $exe = Get-ChildItem mihomo-ci -Filter *.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force mihomo-home | Out-Null
          & $exe.FullName -t -d "$PWD\mihomo-home" -f "$PWD\awgtest.txt.mihomo.yaml"
          if ($LASTEXITCODE -ne 0) { throw 'mihomo rejected the AmneziaWG config' }

      - uses: actions/upload-artifact@v4
        with:
          name: RouteX-test
          path: RouteX.exe
          retention-days: 14

      - name: Keep the exe on the builds/test branch
        shell: bash
        run: |
          mkdir out && cp RouteX.exe out/ && cd out
          git init -q -b builds/test
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add RouteX.exe && git commit -q -m "Test build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds/test
